name: CI

# Confere lint, testes e build a cada push/PR.
# O deploy é o próprio repositório: o GitHub Pages serve a branch main e o jogo
# compilado fica versionado em dist/ (gere com `npm run build` antes do commit).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: dist/ está em dia com o código?
        run: git diff --exit-code --stat -- dist || (echo "::error::dist/ desatualizado — rode 'npm run build' e faça commit." && exit 1)
